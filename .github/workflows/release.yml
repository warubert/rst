name: CI and multi-platform release

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - architecture: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - architecture: i386
            runner: ubuntu-24.04
            rust_target: i686-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      HOST_CC: gcc
      CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER: i686-linux-gnu-gcc
      CC_i686_unknown_linux_gnu: i686-linux-gnu-gcc
      CXX_i686_unknown_linux_gnu: i686-linux-gnu-g++
    steps:
      - uses: actions/checkout@v4

      - name: Install i386 cross-compilation tools
        if: matrix.architecture == 'i386'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config \
            gcc-i686-linux-gnu g++-i686-linux-gnu libc6-dev-i386-cross

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --target ${{ matrix.rust_target }} -- -D warnings

      - name: Run tests
        if: matrix.architecture != 'i386'
        run: cargo test --locked

      - name: Compile i386 tests
        if: matrix.architecture == 'i386'
        run: cargo test --locked --target ${{ matrix.rust_target }} --no-run

  build-deb:
    name: Build Debian package (${{ matrix.architecture }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - architecture: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - architecture: i386
            runner: ubuntu-24.04
            rust_target: i686-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      HOST_CC: gcc
      CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER: i686-linux-gnu-gcc
      CC_i686_unknown_linux_gnu: i686-linux-gnu-gcc
      CXX_i686_unknown_linux_gnu: i686-linux-gnu-g++
    steps:
      - uses: actions/checkout@v4

      - name: Install i386 cross-compilation tools
        if: matrix.architecture == 'i386'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config \
            gcc-i686-linux-gnu g++-i686-linux-gnu libc6-dev-i386-cross

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build cross-compiled i386 Debian package
        if: matrix.architecture == 'i386'
        run: cargo deb --locked --target ${{ matrix.rust_target }} --no-strip

      - name: Build native Debian package
        if: matrix.architecture != 'i386'
        run: cargo deb --locked --target ${{ matrix.rust_target }}

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.architecture }}
          path: target/debian/*.deb
          if-no-files-found: error

  build-windows:
    name: Build and validate Windows (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            rust_target: x86_64-pc-windows-msvc
            wix_architecture: x64
          - architecture: x86
            rust_target: i686-pc-windows-msvc
            wix_architecture: x86
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --target ${{ matrix.rust_target }} -- -D warnings

      - name: Compile tests
        run: cargo test --locked --target ${{ matrix.rust_target }} --no-run

      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = $metadata.packages[0].version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
          }

      - name: Build Windows executable
        run: cargo build --locked --release --target ${{ matrix.rust_target }}

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 4.0.5
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"

      - name: Package ZIP and MSI
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $exe = (Resolve-Path "target/${{ matrix.rust_target }}/release/rst.exe").Path
          $staging = "dist/rst_windows_${{ matrix.architecture }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item $exe "$staging/rst.exe"
          Copy-Item README.md, LICENSE $staging
          Compress-Archive -Path "$staging/*" -DestinationPath "rst_windows_${{ matrix.architecture }}.zip" -Force
          wix build windows/Rst.wxs `
            -arch ${{ matrix.wix_architecture }} `
            -d "ProductVersion=$version" `
            -d "Architecture=${{ matrix.wix_architecture }}" `
            -d "RstExe=$exe" `
            -out "rst_windows_${{ matrix.architecture }}.msi"

      - name: Upload Windows packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}
          path: |
            rst_windows_${{ matrix.architecture }}.zip
            rst_windows_${{ matrix.architecture }}.msi
          if-no-files-found: error

  build-macos:
    name: Build and validate macOS (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-26
            rust_target: aarch64-apple-darwin
          - architecture: x64
            runner: macos-26-intel
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --target ${{ matrix.rust_target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.rust_target }}

      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Build macOS executable
        run: cargo build --locked --release --target ${{ matrix.rust_target }}

      - name: Package ZIP and PKG
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          executable="target/${{ matrix.rust_target }}/release/rst"
          zip_root="dist/rst_macos_${{ matrix.architecture }}"
          pkg_root="pkg-root-${{ matrix.architecture }}"

          mkdir -p "$zip_root" "$pkg_root/usr/local/bin" "$pkg_root/usr/local/share/doc/rst"
          cp "$executable" "$zip_root/rst"
          cp README.md LICENSE "$zip_root/"
          ditto -c -k --sequesterRsrc --keepParent "$zip_root" \
            "rst_macos_${{ matrix.architecture }}.zip"

          cp "$executable" "$pkg_root/usr/local/bin/rst"
          cp README.md LICENSE "$pkg_root/usr/local/share/doc/rst/"
          pkgbuild \
            --root "$pkg_root" \
            --identifier com.warubert.rst \
            --version "$version" \
            --install-location / \
            "rst_macos_${{ matrix.architecture }}.pkg"

      - name: Upload macOS packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.architecture }}
          path: |
            rst_macos_${{ matrix.architecture }}.zip
            rst_macos_${{ matrix.architecture }}.pkg
          if-no-files-found: error

  release:
    name: Publish Debian and Windows release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-deb
      - build-windows
      - build-macos
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download architecture packages
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: packages
          merge-multiple: true

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: windows-packages
          merge-multiple: true

      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: macos-packages
          merge-multiple: true

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Install apt-ftparchive
        run: |
          sudo apt-get update
          sudo apt-get install --yes apt-utils

      - name: Build and sign APT repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_FINGERPRINT: ${{ vars.GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          mkdir -p release-assets apt-repo/pool/main/r/rst
          cp windows-packages/*.msi windows-packages/*.zip release-assets/
          cp macos-packages/*.pkg macos-packages/*.zip release-assets/

          for deb in packages/*.deb; do
            architecture=$(dpkg-deb --field "$deb" Architecture)
            case "$architecture" in
              amd64|arm64|i386) ;;
              *) echo "Unexpected package architecture: $architecture" >&2; exit 1 ;;
            esac

            cp "$deb" apt-repo/pool/main/r/rst/
            printf '%s' "$GPG_PASSPHRASE" |
              gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                --local-user "$GPG_FINGERPRINT" --armor --detach-sign \
                --output "$deb.asc" "$deb"
            gpg --verify "$deb.asc" "$deb"

            cp "$deb" "release-assets/rst_${architecture}.deb"
            cp "$deb.asc" "release-assets/rst_${architecture}.deb.asc"
            tar -czf "release-assets/rst_${architecture}.tar.gz" \
              -C release-assets "rst_${architecture}.deb" \
              "rst_${architecture}.deb.asc"
          done

          test -f release-assets/rst_amd64.deb
          test -f release-assets/rst_arm64.deb
          test -f release-assets/rst_i386.deb
          gpg --armor --export "$GPG_FINGERPRINT" > release-assets/public.key
          cp release-assets/public.key apt-repo/public.key
          (
            cd packages && sha256sum *.deb
            cd ../windows-packages && sha256sum *.msi *.zip
            cd ../macos-packages && sha256sum *.pkg *.zip
          ) > release-assets/SHA256SUMS
          touch apt-repo/.nojekyll

          cd apt-repo
          for architecture in amd64 arm64 i386; do
            mkdir -p "dists/stable/main/binary-${architecture}"
            apt-ftparchive --arch "$architecture" packages pool/main/r/rst \
              > "dists/stable/main/binary-${architecture}/Packages"
            gzip -n -9 -c "dists/stable/main/binary-${architecture}/Packages" \
              > "dists/stable/main/binary-${architecture}/Packages.gz"
          done

          cd dists/stable
          release_file=$(mktemp)
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=RST \
            -o APT::FTPArchive::Release::Label=RST \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o "APT::FTPArchive::Release::Architectures=amd64 arm64 i386" \
            -o APT::FTPArchive::Release::Components=main \
            release . > "$release_file"
          mv "$release_file" Release
          printf '%s' "$GPG_PASSPHRASE" |
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "$GPG_FINGERPRINT" --armor --detach-sign \
              --output Release.gpg Release
          printf '%s' "$GPG_PASSPHRASE" |
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "$GPG_FINGERPRINT" --clearsign \
              --output InRelease Release
          gpg --verify Release.gpg Release
          gpg --verify InRelease

      - name: Upload APT repository artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apt-repo

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.deb
            packages/*.deb.asc
            release-assets/*

  deploy-apt-repository:
    name: Deploy APT repository to GitHub Pages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
