[package]
name = "rst"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
dirs = "7.0.0"
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rust-i18n = "4.2.4"
serde_json = "1"
sys-locale = "0.3.2"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time"] }
